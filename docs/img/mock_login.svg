<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 620" width="300" height="620" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060910"/><stop offset="0.6" stop-color="#0C121D"/><stop offset="1" stop-color="#132038"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3D08A"/><stop offset="1" stop-color="#E7B04A"/></linearGradient>
  </defs>
  <rect x="2" y="2" width="296" height="616" rx="40" fill="#05070c" stroke="#283656" stroke-width="2"/>
  <rect x="12" y="14" width="276" height="592" rx="30" fill="url(#scr)"/>
  <rect x="120" y="14" width="60" height="18" rx="9" fill="#05070c"/>
  <text x="30" y="46" fill="#A9B6CB" font-size="12" font-weight="600">9:41</text>
  <text x="270" y="46" fill="#A9B6CB" font-size="12" text-anchor="end">▮ ▮ ▮</text>

  <!-- emblem -->
  <g transform="translate(110,70)">
