    <g transform="translate(-13,-11) scale(0.9)">
      <path d="M56,26 h8 v8 h8 v8 h-8 v8 h-8 v-8 h-8 v-8 h8 z" fill="url(#gold)"/>
      <circle cx="60" cy="52" r="7" fill="url(#gold)"/>
      <path d="M48,62 C44,74 46,82 60,82 C74,82 76,74 72,62 C68,70 52,70 48,62 Z" fill="#F3D08A"/>
      <path d="M44,86 h32 l-4,10 h-24 z" fill="url(#gold)"/>
    </g>
  </g>
  <text x="150" y="176" fill="#F3F6FB" font-size="17" font-weight="700" text-anchor="middle" direction="rtl">מועדון השחמט פ״ת</text>
  <text x="150" y="198" fill="#A9B6CB" font-size="12" text-anchor="middle" direction="rtl">התחברות</text>

  <!-- email field -->
  <rect x="32" y="222" width="236" height="44" rx="14" fill="#141C2B" stroke="#283656"/>
  <text x="52" y="249" fill="#6E7C93" font-size="13">✉  דוא״ל</text>
  <!-- password field -->
  <rect x="32" y="276" width="236" height="44" rx="14" fill="#141C2B" stroke="#283656"/>
  <text x="52" y="303" fill="#6E7C93" font-size="13">🔒  סיסמה</text>
  <text x="268" y="340" fill="#5B9DF9" font-size="12" text-anchor="end">שכחתי סיסמה</text>

  <!-- sign in -->
  <rect x="32" y="356" width="236" height="46" rx="14" fill="#2B6EE0"/>
  <text x="150" y="384" fill="#FFFFFF" font-size="15" font-weight="700" text-anchor="middle">כניסה</text>

  <text x="150" y="430" fill="#A9B6CB" font-size="13" text-anchor="middle" direction="rtl">אין לך חשבון? הירשם</text>

  <!-- security chips -->
  <g font-size="10" fill="#8FA0B8">
    <rect x="40" y="470" width="100" height="26" rx="13" fill="#141C2B" stroke="#283656"/>
    <text x="90" y="487" text-anchor="middle">🔐 PBKDF2</text>
    <rect x="150" y="470" width="112" height="26" rx="13" fill="#141C2B" stroke="#283656"/>
