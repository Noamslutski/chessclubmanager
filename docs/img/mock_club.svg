    <text x="260" y="240" fill="#A9B6CB" font-size="11" text-anchor="end" direction="rtl">♟ אולם המשחקים, מרכז הנוער</text>
    <rect x="36" y="250" width="228" height="24" rx="10" fill="none" stroke="#283656"/><text x="150" y="266" fill="#5B9DF9" font-size="11" text-anchor="middle" direction="rtl">📞 התקשרות</text>

    <text x="266" y="308" fill="#F3F6FB" font-size="14" font-weight="700" text-anchor="end" direction="rtl">מערכת שעות שבועית</text>
