plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ptchess.club'
    compileSdk 34

    defaultConfig {
        applicationId "com.ptchess.club"
        // API 26+: PBKDF2WithHmacSHA256 and adaptive icons are guaranteed here.
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Support Hebrew (default) and English resources.
        resConfigs "he", "en"
        vectorDrawables.useSupportLibrary = true

        // parse.bot API key — supplied at build time, never committed. Resolved from
        // (1) -PparseApiKey=... , (2) parseApiKey in ~/.gradle/gradle.properties, or
        // (3) the PARSE_API_KEY environment variable.
        def parseApiKey = project.findProperty('parseApiKey') ?: System.getenv('PARSE_API_KEY') ?: ''
        buildConfigField "String", "PARSE_API_KEY", "\"${parseApiKey}\""
    }

    buildTypes {
        release {
            // Shrinking + obfuscation hardens the shipped APK/AAB.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Encrypted session storage (keeps the logged-in user id off plain prefs).
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
